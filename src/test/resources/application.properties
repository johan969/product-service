spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect


# Ger Spring en fejk-URL så den inte försöker ringa en riktig server vid start
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9999

# Eller, om ni använder en specifik JWK-set-uri:
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9999/auth/jwks
